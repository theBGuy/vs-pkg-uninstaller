name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.0.8)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (build only, no publish)'
        required: false
        type: boolean
        default: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.event.release.tag_name }}"
          fi
          VERSION="${VERSION#v}"  # Remove 'v' prefix if present
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Update changelog
        if: inputs.dry_run != true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = '${{ steps.version.outputs.version }}';
            const releaseBody = process.env.RELEASE_BODY || 'Release version ' + version;
            const date = new Date().toISOString().split('T')[0];

            const changelogPath = 'CHANGELOG.md';
            let changelog = fs.readFileSync(changelogPath, 'utf8');

            const newEntry = `## [${version}] - ${date}\n\n${releaseBody}\n`;

            // Find the Unreleased section and insert after it (before the next ## section or end)
            const unreleasedMatch = changelog.match(/## \[Unreleased\][^\n]*\n/);
            if (unreleasedMatch) {
              const insertPos = unreleasedMatch.index + unreleasedMatch[0].length;
              // Skip any content until the next ## section or end of file
              const restOfFile = changelog.slice(insertPos);
              const nextSectionMatch = restOfFile.match(/\n## \[/);

              if (nextSectionMatch) {
                // Insert before the next version section
                const nextSectionPos = insertPos + nextSectionMatch.index + 1;
                changelog = changelog.slice(0, nextSectionPos) + newEntry + '\n' + changelog.slice(nextSectionPos);
              } else {
                // No other sections, append after Unreleased
                changelog = changelog.slice(0, insertPos) + '\n' + newEntry + restOfFile.trim();
              }
            } else {
              // No Unreleased section, add after the header
              const headerEnd = changelog.indexOf('\n\n') + 2;
              changelog = changelog.slice(0, headerEnd) + newEntry + '\n' + changelog.slice(headerEnd);
            }

            fs.writeFileSync(changelogPath, changelog);
            console.log(`Updated CHANGELOG.md with version ${version}`);
        env:
          RELEASE_BODY: ${{ github.event.release.body }}

      - name: Build extension
        run: pnpm build

      - name: Publish to VS Code Marketplace
        if: inputs.dry_run != true
        run: npx vsce publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Commit and push changes
        if: inputs.dry_run != true
        run: |
          git add package.json CHANGELOG.md
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git push origin HEAD:master

      - name: Cleanup VSIX files
        run: |
          if [ -f scripts/cleanup.js ]; then
            node scripts/cleanup.js
          else
            rm -f *.vsix
          fi
